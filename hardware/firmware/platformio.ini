; Selfriser scale model firmware. One board type for the hub and every tower: ESP32-C3 SuperMini.
;   pio run -e tower -t upload        each scale-model tower (then "tower <n>" on its serial console)
;   pio run -e monitor -t upload      a full-size tower: SEN0366 laser, MONITOR ONLY (no motor outputs)
;   pio run -e monitor-vl53 -t upload the model's VL53L1X tower as monitor only, to rehearse that mode
;   pio run -e hub -t upload          the hub on the laptop / phone USB
;   SELFRISER_SSID=... SELFRISER_PASS=... pio run -e hub-wifi -t upload   hub that also serves Wi-Fi
;   pio run -e monitor-xiao / hub-xiao / hub-xiao-wifi -t upload   the same on a Seeed XIAO ESP32C3 (external antenna, job-site range)
;
; Every board talks ESP-NOW long range (include/radio.h). All boards in a system must match: to turn
; it off, add -DRADIO_STANDARD to [env] build_flags and reflash everything.

[platformio]
default_envs = tower, hub

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFW_VERSION=\"0.1.0\"
  -Iinclude

[env:tower]
build_src_filter = +<tower/>
lib_deps =
  pololu/VL53L1X@^1.3.1

[env:monitor]
build_src_filter = +<tower/>
build_flags =
  ${env.build_flags}
  -DSENSOR_SEN0366
  -DMONITOR_ONLY

[env:monitor-vl53]
build_src_filter = +<tower/>
build_flags =
  ${env.build_flags}
  -DMONITOR_ONLY
lib_deps =
  pololu/VL53L1X@^1.3.1

[env:hub]
build_src_filter = +<hub/>
lib_deps =
  bblanchon/ArduinoJson@^7.2.0

[env:hub-wifi]
build_src_filter = +<hub/>
build_flags =
  ${env.build_flags}
  -DHUB_WIFI_SSID=\"${sysenv.SELFRISER_SSID}\"
  -DHUB_WIFI_PASS=\"${sysenv.SELFRISER_PASS}\"
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  links2004/WebSockets@^2.6.1

; Seeed XIAO ESP32C3: same chip and GPIOs, comes with an external antenna. No user LED.
[env:monitor-xiao]
board = seeed_xiao_esp32c3
build_src_filter = +<tower/>
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_C3
  -DSENSOR_SEN0366
  -DMONITOR_ONLY

[env:hub-xiao]
board = seeed_xiao_esp32c3
build_src_filter = +<hub/>
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_C3
lib_deps =
  bblanchon/ArduinoJson@^7.2.0

[env:hub-xiao-wifi]
board = seeed_xiao_esp32c3
build_src_filter = +<hub/>
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_C3
  -DHUB_WIFI_SSID=\"${sysenv.SELFRISER_SSID}\"
  -DHUB_WIFI_PASS=\"${sysenv.SELFRISER_PASS}\"
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  links2004/WebSockets@^2.6.1

; Bench test before the laser arrives: a monitor tower that feeds itself SEN0366 frames. Jumper the
; XIAO's D6 (TX) to D7 (RX); console "sim <mm>" pins the distance, "sim sweep" goes back to sweeping.
[env:monitor-xiao-loopback]
board = seeed_xiao_esp32c3
build_src_filter = +<tower/>
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_C3
  -DSENSOR_SEN0366
  -DMONITOR_ONLY
  -DLASER_LOOPBACK

; Garmin LIDAR-Lite v3 (Micro Center, ~$53) as a monitor tower on a XIAO: 40 m, about +-1". 5 V, I2C on
; D4 (SDA) / D5 (SCL), 680 uF capacitor across its 5 V and GND. See hardware/README.md.
[env:monitor-xiao-lidarlite]
board = seeed_xiao_esp32c3
build_src_filter = +<tower/>
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_C3
  -DSENSOR_LIDARLITE
  -DMONITOR_ONLY
